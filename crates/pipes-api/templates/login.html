{% extends "base.html" %}
{% block title %}Log in · rmf-pipes{% endblock %}
{% block content %}
<form id="login" class="card" style="max-width: 360px">
  <h2 style="margin-top: 0">Log in</h2>
  <p><label>Username<br><input name="username" autocomplete="username" required autofocus></label></p>
  <p><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label></p>
  <p><button type="submit">Log in</button> <span id="error" class="bad"></span></p>
</form>
<script id="login-page" data-next="{{ next }}">
(function () {
  var next = document.getElementById("login-page").dataset.next;
  // Only same-site paths: never redirect to another origin.
  // The server already sanitised `next`; also insist it stays on this origin.
  try { if (new URL(next, window.location.href).origin !== window.location.origin) next = "/"; }
  catch (e) { next = "/"; }
  var form = document.getElementById("login");
  var errorEl = document.getElementById("error");
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    errorEl.textContent = "";
    fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: form.username.value, password: form.password.value })
    }).then(function (r) {
      if (r.ok) { window.location.assign(next); return; }
      return r.json().then(function (b) { errorEl.textContent = b.message; });
    }).catch(function () { errorEl.textContent = "cannot reach rmf-pipes"; });
  });
})();
</script>
{% endblock %}
