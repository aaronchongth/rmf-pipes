[package]
name = "pipes-bus"
description = "rmf-pipes bus: the only crate that talks to hiroz/zenoh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exactly one ROS 2 distro must be selected. hiroz owns the per-distro rmw_zenoh
# conventions; we only forward the choice. To build for another distro:
#   cargo build --no-default-features --features jazzy
default = ["lyrical"]
jazzy = ["hiroz/jazzy"]
kilted = ["hiroz/kilted"]
lyrical = ["hiroz/lyrical"]
rolling = ["hiroz/rolling"]

[dependencies]
pipes-core.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
hiroz = { workspace = true, features = ["rmw-zenoh"] }
# Graph entities carry hiroz-protocol's QoS types, which hiroz does not re-export.
hiroz-protocol.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zenoh.workspace = true

[lints]
workspace = true
