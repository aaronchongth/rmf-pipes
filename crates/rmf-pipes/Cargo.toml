[package]
name = "rmf-pipes"
description = "rmf-pipes server: the data layer for next-generation Open-RMF."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# One distro per build (see pipes-bus). Each also selects the test kit's distro
# so `cargo test --no-default-features --features <distro>` stays consistent.
default = ["lyrical"]
jazzy = ["pipes-bus/jazzy", "pipes-testkit/jazzy"]
kilted = ["pipes-bus/kilted", "pipes-testkit/kilted"]
lyrical = ["pipes-bus/lyrical", "pipes-testkit/lyrical"]
rolling = ["pipes-bus/rolling", "pipes-testkit/rolling"]

[dependencies]
pipes-core.workspace = true
pipes-bus.workspace = true
pipes-api.workspace = true
pipes-db.workspace = true
anyhow.workspace = true
clap.workspace = true
humantime.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sqlx.workspace = true
futures.workspace = true
pipes-testkit = { workspace = true }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
